version: '3.9'

services:
  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
    image: ai-mock-interview-client:latest
    ports:
      - '5173:4173'
    environment:
      - VITE_API_BASE_URL=${BACKEND_URL:-http://localhost:5000}
    depends_on:
      - server
    networks:
      - app-network

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    image: ai-mock-interview-server:latest
    env_file:
      - ../.env
    ports:
      - '5000:5000'
    depends_on:
      - mongo
      - redis
      - ai-service
    networks:
      - app-network

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.ai
    image: ai-mock-interview-ai:latest
    env_file:
      - ../.env
    ports:
      - '8000:8000'
    networks:
      - app-network

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - '27017:27017'
    networks:
      - app-network

  redis:
    image: redis:8.4-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
